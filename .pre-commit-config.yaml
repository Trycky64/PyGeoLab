repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format check
        entry: python -m ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: python -m mypy src
        language: system
        types_or: [python, pyi]
        pass_filenames: false
