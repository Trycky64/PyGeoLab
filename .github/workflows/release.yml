name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PyGeoLab-Windows-x64.zip
          - os: ubuntu-latest
            artifact: PyGeoLab-Linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyside6
      PYGEOLAB_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag and version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check-release-tag.py "${{ github.ref_name }}"
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Build Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: PyGeoLab ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
